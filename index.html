<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Everything between the SEO markers below is REPLACED PER ROUTE at build
      time by prerender.mjs, which writes one index.html per URL into dist/.
      That is what non-JS crawlers (Bing, Twitter, Facebook, LinkedIn, WhatsApp)
      see, since they never run the React app.

      The values here are the homepage / fallback set. Do not remove the
      markers, and keep PageMeta.tsx in sync — it sets the same tags at runtime
      for client-side navigation.
    -->
    <!--SEO-->
    <title>Cosmetics Asia — Compare Medical Aesthetics Clinics & Surgeons in Asia</title>
    <meta
      name="description"
      content="Compare verified medical aesthetics clinics and board-certified surgeons across Asia. Browse real patient cases, procedures and pricing in Seoul, Bangkok, Tokyo, Singapore and more."
    />
    <link rel="canonical" href="https://cosmetics-asia.com/" />
    <meta name="author" content="Cosmetics Asia" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cosmetics Asia" />
    <meta property="og:url" content="https://cosmetics-asia.com/" />
    <meta
      property="og:title"
      content="Cosmetics Asia — Compare Medical Aesthetics Clinics & Surgeons in Asia"
    />
    <meta
      property="og:description"
      content="Compare verified medical aesthetics clinics and board-certified surgeons across Asia. Browse real patient cases, procedures and pricing."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Cosmetics Asia — Compare Medical Aesthetics Clinics & Surgeons in Asia"
    />
    <meta
      name="twitter:description"
      content="Compare verified medical aesthetics clinics and board-certified surgeons across Asia. Browse real patient cases, procedures and pricing."
    />
    <!--/SEO-->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
