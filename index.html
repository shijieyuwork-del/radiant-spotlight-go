<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin" />
    <link rel="icon" type="image/svg+xml" href="/ca-favicon.svg?v=1" />
    <link rel="shortcut icon" href="/ca-favicon.svg?v=1" />
    <link rel="apple-touch-icon" href="/ca-favicon.svg?v=1" />
    <meta name="theme-color" content="#55be98" />
    <meta name="application-name" content="Sino Aesthetics" />
    <meta name="apple-mobile-web-app-title" content="Sino Aesthetics" />
    <link rel="preload" as="image" href="/videos/v2-poster.webp" fetchpriority="high" />

    <!--
      Everything between the SEO markers below is REPLACED PER ROUTE at build
      time by prerender.mjs, which writes one index.html per URL into dist/.
      That is what non-JS crawlers (Bing, Twitter, Facebook, LinkedIn, WhatsApp)
      see, since they never run the React app.

      The values here are the homepage / fallback set. Do not remove the
      markers, and keep PageMeta.tsx in sync — it sets the same tags at runtime
      for client-side navigation.
    -->
    <!--SEO-->
    <title>Cosmetic Care in China for International Visitors | Sino Aesthetics</title>
    <meta
      name="description"
      content="Compare licensed hospitals and specialists in China, prepare for your consultation, and plan translation and travel support. Coordination only — not a clinic."
    />
    <link rel="canonical" href="https://sinoaesthetics.com/" />
    <meta name="author" content="Sino Aesthetics" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sino Aesthetics" />
    <meta property="og:url" content="https://sinoaesthetics.com/" />
    <meta
      property="og:title"
      content="Cosmetic Care in China for International Visitors | Sino Aesthetics"
    />
    <meta
      property="og:description"
      content="Compare licensed hospitals and specialists in China, prepare for your consultation, and plan translation and travel support. Coordination only — not a clinic."
    />
    <meta property="og:image" content="https://sinoaesthetics.com/og-image.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Cosmetic Care in China for International Visitors | Sino Aesthetics"
    />
    <meta
      name="twitter:description"
      content="Compare licensed hospitals and specialists in China, prepare for your consultation, and plan translation and travel support. Coordination only — not a clinic."
    />
    <meta name="twitter:image" content="https://sinoaesthetics.com/og-image.jpg" />
    <!--/SEO-->
    <meta name="google-site-verification" content="Ics42RKS25hWfLn-C5_C1BgGV5w87PkxlAihR0JJ9MU" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
